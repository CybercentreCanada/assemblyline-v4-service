core:
  redis:
    nonpersistent:
      host: localhost
    persistent:
      host: localhost
      port: 6379

datastore:
  hosts: [http://elastic:devpass@localhost:9200]

filestore:
  cache:
    - file:///var/cache/assemblyline/
  storage:
    - file:///var/cache/assemblyline/
logging:
  log_to_console: false
  log_to_file: false
  log_to_syslog: false
